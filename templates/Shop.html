{% extends "layout.html" %}

{% block title %}Shop - The Golden Children{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='Shop.css') }}">
{% endblock %}

{% block content %}
    <section class="allclothes" aria-label="Product listings">
      {% for product in products %}
      <article class="clothes{{ loop.index if loop.index > 1 else '' }}">
        <img src="{{ url_for('static', filename=product.image) }}" alt="{{ product.name }}" width="100" height="100">
        <h1>{{ product.name }}</h1>
      </article>
      {% else %}
        <!-- Fallback if no products passed yet (will be removed once dynamic shop is fully implemented) -->
        <p>Loading products...</p>
      {% endfor %}
    </section>
{% endblock %}
